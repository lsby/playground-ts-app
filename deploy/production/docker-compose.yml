services:
  app:
    image: lsby-playground-ts-app-prod
    build:
      context: ../../
      dockerfile: ./deploy/production/dockerfile
      secrets:
        - app_env
    ports:
      - '${DOCKER_PORT:?缺少环境变量 DOCKER_PORT}:${APP_PORT:?缺少环境变量 APP_PORT}'
    env_file:
      - ../../.env/.env.production.web
    restart: always
    volumes:
      - ../../db:/opt/app/db
      - ../../.env/.env.production.web:/opt/app/.env/.env.production.web:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:' + process.env.APP_PORT + '/api/system/health', { signal: AbortSignal.timeout(4000) }).then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      options:
        max-size: '100m'
        max-file: '5'
secrets:
  app_env:
    file: ../../.env/.env.production.web
