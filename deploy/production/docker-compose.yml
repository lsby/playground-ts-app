services:
  app:
    image: lsby-playground-ts-app-prod
    build:
      context: ../../
      dockerfile: ./deploy/production/dockerfile
      secrets:
        - app_env
    ports:
      - '${DOCKER_PORT:?缺少环境变量 DOCKER_PORT}:${APP_PORT:?缺少环境变量 APP_PORT}'
    env_file:
      - ../../.env/.env.production.web
    restart: always
    volumes:
      - ../../db:/opt/app/db
      - ../../.env/.env.production.web:/opt/app/.env/.env.production.web:ro
    logging:
      options:
        max-size: '100m'
        max-file: '5'
secrets:
  app_env:
    file: ../../.env/.env.production.web
