name: 发布 Electron 完整便携包

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release 标签名 (例如 v1.0.0，留空则自动根据 package.json 版本生成)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release-electron:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.5.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Windows 下使用 hoisted 布局，避免 Electron/Parcel 的深层 pnpm 路径问题。
      - name: 配置依赖布局
        shell: pwsh
        run: pnpm config set node-linker hoisted

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 准备 Electron 数据库
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path db | Out-Null
          New-Item -ItemType File -Force -Path db/prod-electron.db | Out-Null

      - name: 构建完整便携包
        run: pnpm run public:electron -- --zip

      - name: 计算 Release 标签
        id: get_tag
        shell: pwsh
        run: |
          if ("${{ github.ref }}".StartsWith("refs/tags/")) {
            $tag = "${{ github.ref_name }}"
          } elseif ("${{ inputs.tag_name }}" -ne "") {
            $tag = "${{ inputs.tag_name }}"
          } else {
            $ver = (Get-Content package.json | ConvertFrom-Json).version
            $tag = "v$ver"
          }
          Write-Host "Release Tag: $tag"
          "tag_name=$tag" >> $env:GITHUB_OUTPUT

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag_name }}
          generate_release_notes: true
          files: release/electron/*.zip
